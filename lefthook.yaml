pre-commit:
  jobs:
    - name: 'format'
      run: 'node --run fix:format'
      stage_fixed: true

    - name: 'checks'
      group:
        parallel: true
        jobs:
          - name: 'secret'
            run: 'gitleaks git --staged --no-banner'

          - name: 'lint'
            run: 'node --run check:lint'

          - name: 'type'
            run: 'node --run check:type'

          - name: 'peer'
            glob: '{package.json,pnpm-lock.yaml}'
            run: 'pnpm peers check --lockfile-only'

          - name: 'yaml'
            glob: '*.{yaml,yml}'
            run: 'node --run check:yaml'

prepare-commit-msg:
  jobs:
    - name: 'trailer'
      run: 'bash .claude/commit-trailer.sh {1} {2} {3}'

pre-push:
  jobs:
    - name: 'secret'
      run: 'gitleaks git --no-banner'
